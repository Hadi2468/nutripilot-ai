[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutripilot-ai"
version = "2.0.0"
description = "Structured, validated nutrition planning with LLMs: FastAPI on AWS Lambda, Groq or OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hadi Hosseini" }]
keywords = ["llm", "nutrition", "meal-planning", "fastapi", "aws-lambda", "groq", "structured-output"]
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["uvicorn[standard]>=0.29"]
cli = ["rich>=13.7"]
dashboard = ["streamlit>=1.50", "altair>=5", "pandas>=2", "requests>=2.31"]
dev = [
    "nutripilot-ai[api,cli]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "cfn-lint>=1.0",
]

[project.scripts]
nutripilot = "nutripilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nutripilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["nutripilot"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101", "S105", "S106"]
